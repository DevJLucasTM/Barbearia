<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Meu agendamento | Barbearia</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/comum.js" defer></script>
  <script src="js/agendamento.js" defer></script>
</head>
<body>
  <header class="topo">
    <div class="container">
      <a href="/" class="marca">✂ <span>Barbearia</span></a>
      <nav>
        <a href="/">Agendar</a>
        <a href="agendamento.html" aria-current="page">Meu agendamento</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <h1>Meu agendamento</h1>
      <p>Digite o código que você recebeu pra ver os detalhes ou cancelar.</p>
    </section>

    <form class="busca passo" id="form-busca">
      <label for="codigo" class="sr-only">Código do agendamento</label>
      <div class="campo" style="flex:1">
        <input id="codigo" maxlength="6" placeholder="EX: K7P2QM" autocomplete="off" required>
      </div>
      <button class="botao" type="submit">Buscar</button>
    </form>

    <div class="salvos" id="salvos"></div>
    <p class="erro" id="erro" role="alert"></p>

    <section class="cartao" id="detalhes" hidden></section>
  </main>
</body>
</html>
