<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Painel do barbeiro</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/comum.js" defer></script>
  <script src="js/admin.js" defer></script>
</head>
<body>
  <header class="topo">
    <div class="container">
      <a href="/" class="marca">✂ <span>Painel</span></a>
      <nav>
        <a href="/">Ver site</a>
        <a href="#" id="sair" hidden>Sair</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="cartao" id="login">
      <h2>Área do barbeiro</h2>
      <form class="form" id="form-login">
        <div class="campo">
          <label for="senha">Senha</label>
          <input id="senha" type="password" autocomplete="current-password" required>
        </div>
        <p class="erro" id="erro-login" role="alert"></p>
        <button class="botao" type="submit">Entrar</button>
      </form>
    </section>

    <section id="painel" hidden>
      <div class="barra-dia">
        <button class="botao secundario" id="anterior" aria-label="Dia anterior">←</button>
        <input type="date" id="data">
        <button class="botao secundario" id="proximo" aria-label="Próximo dia">→</button>
        <button class="botao secundario" id="hoje">Hoje</button>
        <button class="botao secundario" id="recarregar" title="Atualizar">↻</button>
      </div>

      <h2 id="titulo-dia" style="font-family: var(--serif); font-weight: normal; margin: 0 0 14px"></h2>

      <div class="numeros">
        <div class="numero-card"><span>Agendados</span><strong id="n-confirmados">0</strong></div>
        <div class="numero-card"><span>Cancelados</span><strong id="n-cancelados">0</strong></div>
        <div class="numero-card"><span>Previsto</span><strong id="n-faturamento">R$ 0</strong></div>
      </div>

      <ul class="agenda" id="agenda"></ul>
      <p class="erro" id="erro-painel" role="alert"></p>
    </section>
  </main>
</body>
</html>
